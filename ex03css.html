<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1 {
        background-color: mediumseagreen;
        text-align: center;
        color: yellow;
    }

    ul {
        border: 0px solid black;
        list-style: none;
        padding: 0;
        width: 500px;
        overflow: hidden;
    }

    ul li {
        border-bottom: 1px solid black;
        border-top: 1px solid #000;
        width: 100px;
        height: 40px;
        text-align: center;
        line-height: 40px;
        float: left;
        box-sizing: border-box;
    }
    ul li:hover {
        border-color: palevioletred;
        border-bottom: 3px solid palevioletred;
        background-color: palevioletred;
    }
</style>

<body>
    <h1>저녕의 홈페이지</h1>
    <ul>
        <li>Home</li>
        <li>Profile</li>
        <li>Gallery</li>
        <li>Contact</li>
        <li>Board</li>
    </ul>
</body>
</html>
