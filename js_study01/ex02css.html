<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* body 태그의 배경색을 핑크색으로 설정하는 css */
        body {
            background-color: salmon;
        }
        /* 
            선택기 {속성: 값; 속성: 값; ...}

            선택기: 태그명, 클래스명, 아이디명, 속성값 등으로 요소를 선택하는 방법
            속성: 요소의 스타일을 지정하는 항목
            값: 속성에 적용할 스타일의 구체적인 내용

            태그명으로 선택: p {color: red;} -> 모든 p태그의 글자색을 빨간색으로 변경
            클래스명으로 선택: .className {color: red;} -> class="className"인 요소의 글자색을 빨간색으로 변경
            아이디명으로 선택: #idName {color: red;} -> id="idName"인 요소의 글자색을 빨간색으로 변경   

            태그이름으로 선택, 클래스스로 선택, 아이디로선택, 속성으로 선택
            태그명 . # [] 등으로 선택기 사용가능.
        */

        h1 {
            color: blueviolet;
            background-color: wheat;
        }

        p {
            color: black;
        }

        .title {
            color: white;
        }
    </style>
</head>

<body>
    <h1>가나다라마바사</h1>
    <p class="title">ABCDEFG</p>
    <p>AI 수업</p>
</body>
</html>
