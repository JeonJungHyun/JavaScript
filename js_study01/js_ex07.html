<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var todos = [
            {
                "userId": 1,
                "id": 1,
                "title": "delectus aut autem",
                "completed": false
            },
            {
                "userId": 1,
                "id": 2,
                "title": "quis ut nam facilis et officia qui",
                "completed": false
            },
            {
                "userId": 1,
                "id": 3,
                "title": "fugiat veniam minus",
                "completed": false
            }
        ]
        // id 값 자동증가
        var todoIdCnt = 4;
        // 다른 함수 사용가능
        var todoList = null;

        window.onload = function () {
            const todoInput = document.querySelector("#todo");
            const addBtn = document.querySelector("#addBtn");
            window.todoList = document.querySelector(".todoList");
            // 버튼을 누르면 todos에 새 item 추가
            addBtn.onclick = function (e) {
                todos.push({
                    "userId": 2,
                    "id": todoIdCnt,
                    "title": todoInput.value,
                    "completed": false
                });
                todoInput.value = "";
                todoInput.focus();
                

                // 2. 새 item 추가 후 다시 그리기
                drawList(todoList);
            }

            // 1. 파일로드 직후에 목록 그리기
            drawList(todoList);
        }

        function deleteHandler(target) {
            // 스스로 하기
            // 1. 삭제 버튼에 이벤트 핸들러 달기
            // 2. 몇 번째 삭제버튼인지 확인
            // 3-1. 해당 요소를 todos에서 제거
            // 3-2. 해당 행의 id 확인
            // 4. 목록 다시 갱신 - drawList(todoList) 재호출
            // console.dir(target.parentElement.firstChild.innerText)
            var key = Number(target.dataset['key']);
            // console.dir(key);
            // key가 몇 번쨰 todo의 id와 일치하는지 찾기
            var idx = todos.findIndex(function (item, i) {
                // console.log(item.id === key);
                return item.id === key
            });
            // console.log("idx", idx)
            // idx가 -1이 아니면 찾은 index가 존재한다.
            // splice()함수로 해당 item 제거
            if(idx != -1) {
                todos.splice(idx, 1);
                // 삭제 후 목록 다시 갱신
                drawList(todoList);
            }
        }

        // 선언: window.onload 외부 선언 todoList를 전달 받아야 한다. 
        function drawList(todoList) {
            // todos 배열의 item을 todoList에 추가
            todoList.innerHTML = "";
            todos.forEach(function (item, index) {
                todoList.innerHTML += `<li><span>${item.id}</span>: ${item.title} 
                    <button data-key=${item.id} onclick="deleteHandler(this)">삭제</button></li>`;
            });
        }
    </script>
</head>

<body>
    <h1>버튼 이벤트 연습</h1>
    할일: <input type="text" id="todo" value="백화점 가기">
    <button id="addBtn">확인</button>
    <ul class="todoList"></ul>

</body>
</html>
