<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 01</title>
</head>

<body>

    <h1>자바스크립트 배우기</h1>
    <!-- button#okbtn{확인}+div.box{내용출력$}*3 -->
   <button id="okbtn">확인</button>
   <div class="box">내용출력1</div>
   <div class="box">내용출력2</div>
   <div class="box">내용출력3</div>

    <script>
        // 통합된 DOM 선택 기능(태그명, #, ., [] ...)
        // CSS 선택기 문법 그대로 사용 가능.
        // console.dir(window === this);
        // console.dir(window.document);
        // console.dir(this.document);
        // console.dir(document);

        // id DOM 선택: querySelector()
        // 단수 선택
        var okbtn = document.querySelector("#okbtn");
        console.dir(okbtn);
        // 복수 선택(List 형식)
        // 배열(Array) == List
        // 자바스크립트의 배열은 List 컬렉션이다.
        var divList = document.querySelectorAll(".box");
        console.dir(divList);

        // ES6의 스프리드 연산자로 복제하기
        var divArr = [... divList];
        console.dir(divArr);

        var div1 = divArr[0];
        console.dir(div1);
    </script>
</body>

</html>
