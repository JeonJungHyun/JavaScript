<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var todos = [
            {
                "userId": 1,
                "id": 1,
                "title": "delectus aut autem",
                "completed": false
            },
            {
                "userId": 1,
                "id": 2,
                "title": "quis ut nam facilis et officia qui",
                "completed": false
            },
            {
                "userId": 1,
                "id": 3,
                "title": "fugiat veniam minus",
                "completed": false
            }
        ]


        window.onload = function () {
            const todoInput = document.querySelector("#todo");
            const addBtn = document.querySelector("#addBtn");
            const todoList = document.querySelector(".todoList");
            // 버튼을 누르면 todos에 새 item 추가
            addBtn.onclick = function (e) {
                todos.push({
                    "userId": 2,
                    "id": 3,
                    "title": "새 할일 입력 테스트",
                    "completed": false
                });
                console.log("입력 완료");
                // 정상 입력 확인
                console.dir(todos);

                // 2. 새 item 추가 후 다시 그리기
                drawList(todoList);
            }

            // 1. 파일로드 직후에 목록 그리기
            drawList(todoList);
        }

        // 선언: window.onload 외부 선언 todoList를 전달 받아야 한다. 
        function drawList(todoList) {
            // todos 배열의 item을 todoList에 추가
            todoList.innerHTML = "";
            todos.forEach(function (item, index) {
                todoList.innerHTML += `<li>${item.title} <button>삭제</button></li>`;
            });

            // 스스로 하기
            // 1. 삭제 버튼에 이벤트 핸들러 달기
            // 2. 몇번째 삭제버튼인지 확인
            // 3. 해당 요소를 todoList에서 제거
            // 4. 목록 다시 갱신 - drawList(todoList) 재 호출
        }
    </script>
</head>

<body>
    <h1>버튼 이벤트 연습</h1>
    할일: <input type="text" id="todo" value="백화점 가기">
    <button id="addBtn">확인</button>
    <ul class="todoList"></ul>

</body>

</html>
